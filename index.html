<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Payroll Management System</title>
    <!-- Use FontAwesome for icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="login-body">

    <div class="login-container">
        <div class="login-header">
            <i class="fas fa-wallet"></i>
            <h1>Nexus Payroll</h1>
            <p>Welcome back! Please login to your account.</p>
        </div>
        
        <form id="loginForm">
            <div class="form-group" style="text-align: left;">
                <label for="username">Username / Email</label>
                <input type="text" id="username" class="form-control" placeholder="Enter your username" required>
            </div>
            <div class="form-group" style="text-align: left;">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" placeholder="Enter your password" required>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; justify-content: center; margin-top: 10px; padding: 14px;">
                Login <i class="fas fa-arrow-right"></i>
            </button>
        </form>
        
        <p style="margin-top: 24px; color: var(--text-light); font-size: 14px;">
            <i class="fas fa-lock"></i> Secure corporate portal
        </p>
    </div>

    <script src="js/main.js"></script>
</body>
</html>
